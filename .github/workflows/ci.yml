name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python tasks.py lint

      - name: Test (coverage must be >= 85%)
        run: python -m pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85

      - name: Synthetic data and labels are reproducible
        run: |
          python tasks.py data
          git diff --exit-code -- data/

      - name: Evaluate
        if: hashFiles('src/evaluation/report.py') != ''
        run: python tasks.py evaluate

      - name: Upload evaluation report
        if: hashFiles('reports/evaluation_report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/evaluation_report.md
